
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#dfeaff">
  <title>Lucky Reveal | SPARK ICT CLUB</title>

  <style>
    :root {
      --blue: #8db8f5;
      --blue-dark: #5488d4;
      --lavender: #c5b5f5;
      --pink: #f7cce4;
      --white: #ffffff;
      --text: #424766;
      --muted: #777e9e;
      --shadow: 0 18px 50px rgba(103, 119, 180, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 15%, #ffffff 0, transparent 23%),
        radial-gradient(circle at 90% 85%, #f8dff1 0, transparent 25%),
        linear-gradient(140deg, #dff0ff 0%, #e9e3ff 48%, #fce8f5 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow-x: hidden;
      position: relative;
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 3px solid #547fc8;
      outline-offset: 4px;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      color: white;
      opacity: 0.8;
      animation: twinkle 2.8s ease-in-out infinite alternate;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
    }

    .star:nth-child(1) {
      top: 10%;
      left: 12%;
      font-size: 22px;
    }

    .star:nth-child(2) {
      top: 19%;
      right: 14%;
      font-size: 29px;
      animation-delay: 0.8s;
    }

    .star:nth-child(3) {
      top: 73%;
      left: 8%;
      font-size: 25px;
      animation-delay: 1.2s;
    }

    .star:nth-child(4) {
      right: 10%;
      bottom: 15%;
      font-size: 21px;
      animation-delay: 0.5s;
    }

    .star:nth-child(5) {
      top: 47%;
      left: 4%;
      font-size: 15px;
      animation-delay: 1.7s;
    }

    .star:nth-child(6) {
      top: 43%;
      right: 5%;
      font-size: 17px;
      animation-delay: 0.3s;
    }

    @keyframes twinkle {
      from {
        opacity: 0.35;
        transform: scale(0.8) rotate(0deg);
      }
      to {
        opacity: 1;
        transform: scale(1.15) rotate(18deg);
      }
    }

    .page {
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 1;
    }

    .card {
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 28px 24px 22px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.83);
      box-shadow: var(--shadow);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
    }

    .card::before {
      background: rgba(197, 181, 245, 0.25);
      top: -90px;
      left: -65px;
    }

    .card::after {
      background: rgba(141, 184, 245, 0.23);
      right: -80px;
      bottom: -90px;
    }

    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #dceaff, #e8ddff);
      font-size: 18px;
    }

    .brand-name {
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: 800;
      color: #6b77a6;
    }

    .eyebrow {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 30px;
      background: #f0eaff;
      color: #8571c3;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .gift-wrap {
      height: 145px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 0 auto 8px;
    }

    .gift-glow {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      position: absolute;
      background: linear-gradient(135deg, #e0edff, #f0e3ff);
      box-shadow: 0 0 0 12px rgba(231, 232, 255, 0.32);
    }

    .gift {
      font-size: 83px;
      line-height: 1;
      position: relative;
      filter: drop-shadow(0 9px 8px rgba(94, 112, 174, 0.17));
      animation: floatGift 2.8s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes floatGift {
      0%, 100% {
        transform: translateY(0) rotate(-3deg);
      }
      50% {
        transform: translateY(-9px) rotate(3deg);
      }
    }

    .mini-sparkle {
      position: absolute;
      font-size: 22px;
      color: #b49be9;
      animation: sparkle 1.8s ease-in-out infinite alternate;
    }

    .sparkle-one {
      top: 19px;
      left: 55px;
    }

    .sparkle-two {
      right: 53px;
      bottom: 23px;
      animation-delay: 0.8s;
    }

    @keyframes sparkle {
      from {
        transform: scale(0.7) rotate(0deg);
        opacity: 0.5;
      }
      to {
        transform: scale(1.2) rotate(25deg);
        opacity: 1;
      }
    }

    h1 {
      font-size: clamp(32px, 8vw, 43px);
      line-height: 1.12;
      letter-spacing: -1.6px;
      font-weight: 900;
      color: #535c91;
      margin-bottom: 12px;
    }

    h1 span {
      color: #8e79d0;
    }

    .subtitle {
      max-width: 300px;
      margin: 0 auto 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .reveal-button {
      width: 100%;
      min-height: 62px;
      border: none;
      border-radius: 19px;
      color: white;
      background: linear-gradient(110deg, #7eabef, #a28be8 58%, #bd9ee9);
      box-shadow: 0 9px 0 #d7d1f1, 0 15px 25px rgba(121, 125, 201, 0.22);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.1px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      position: relative;
      overflow: hidden;
    }

    .reveal-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -110%;
      width: 70%;
      height: 100%;
      background: linear-gradient(
        100deg,
        transparent,
        rgba(255, 255, 255, 0.3),
        transparent
      );
      transform: skewX(-20deg);
      transition: left 0.6s ease;
    }

    .reveal-button:hover::before {
      left: 140%;
    }

    .reveal-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 11px 0 #d7d1f1, 0 18px 28px rgba(121, 125, 201, 0.25);
    }

    .reveal-button:active:not(:disabled) {
      transform: translateY(5px);
      box-shadow: 0 4px 0 #d7d1f1;
    }

    .reveal-button:disabled {
      cursor: default;
      opacity: 0.75;
    }

    .button-sparkle {
      display: inline-block;
      margin-left: 5px;
    }

    .sound-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 19px;
    }

    .sound-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid #e4e2f6;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.72);
      padding: 8px 13px;
      font-size: 11px;
      font-weight: 700;
      color: #77759f;
      cursor: pointer;
    }

    .sound-button:hover {
      background: #f2efff;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(
        to right,
        transparent,
        #e7e5f5,
        transparent
      );
      margin: 20px 0 13px;
    }

    .purchase-note {
      font-size: 11px;
      line-height: 1.6;
      color: #8a8eaa;
    }

    .purchase-note strong {
      color: #7774a7;
    }

    .footer {
      margin-top: 17px;
      color: #8e8fb0;
      font-size: 10px;
      letter-spacing: 1.4px;
      font-weight: 800;
    }

    .result-panel {
      display: none;
      margin-top: 20px;
      padding: 20px 16px;
      border-radius: 22px;
      animation: resultAppear 0.55s cubic-bezier(.2, .8, .2, 1) both;
    }

    .result-panel.show {
      display: block;
    }
